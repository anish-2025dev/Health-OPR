name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  services:
    name: Services and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Start PostgreSQL and Redis with the dev compose file
        run: |
          cp .env.example .env
          docker compose up -d --wait

      - run: npm ci

      - name: Apply migrations to a throwaway database
        run: npm run db:migrate

      - name: Integration tests (auth, tenant isolation, RLS, permissions)
        run: npm run test:integration --workspace apps/api

      - name: API readiness smoke test
        run: |
          npm run start --workspace apps/api &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/v1/health/ready; then exit 0; fi
            sleep 1
          done
          echo "API did not become ready" && exit 1

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --verbose
