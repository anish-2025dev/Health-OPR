# Render Blueprint: https://render.com/docs/blueprint-spec
# DEMO deployment (branch demo, Render FREE plan). Same application code as main; only this file
# differs. Creates healthos-demo-* services and, on the first deploy, a demo hospital with fictional
# people and 2 logins of every type (see DEMO.md and docs/deployment/demo-setup.md).
# Use a SEPARATE Neon project for the demo, never the pilot's database.
# PostgreSQL is hosted on Neon (not Render). Paste Neon's connection strings when Render prompts for
# the `sync: false` variables. Never commit real values to this file.

services:
  # ---------------------------------------------------------------- API (Express)
  - type: web
    name: healthos-demo-api
    runtime: node
    region: singapore # keep close to the Neon region (AWS ap-southeast-1, Singapore)
    # DEMO: free plan (sleeps after ~15 minutes idle). The pilot on branch main uses Starter.
    plan: free
    branch: demo
    # Works on both plans: install, update the database, then the optional first logins / demo hospital
    # from the BOOTSTRAP_* variables below (does nothing when they are empty).
    buildCommand: npm ci && npm run db:migrate && npm run bootstrap --workspace apps/api
    startCommand: npm run start --workspace apps/api
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass # deploy only after GitHub CI passes
    buildFilter:
      paths:
        - apps/api/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: APP_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: '15'
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: '14'
      # Neon POOLED connection string (host contains "-pooler"), ending in ?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Neon DIRECT connection string (host without "-pooler"), used only for migrations
      - key: DATABASE_MIGRATION_URL
        sync: false
      # https:// URL of the healthos-demo-web static site, used for CORS
      - key: FRONTEND_URL
        sync: false
      # https:// URL of the healthos-demo-patient static site (CORS and links sent to patients)
      - key: PATIENT_SITE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: healthos-demo-redis
          property: connectionString
      # No SMS account on the demo: sign-in codes for the demo hospital's fictional numbers
      # (+91 90000 00xxx) are shown on screen. Real numbers get "SMS not set up".
      - key: SMS_PROVIDER
        value: ''
      - key: SMS_DEMO_CODES
        value: 'true'
      # Creates the demo hospital on the first deploy (skipped once it exists). Change the code
      # (e.g. demo-hospital-2) and redeploy to get a fresh copy.
      - key: DEMO_HOSPITAL_CODE
        value: demo-hospital
      # Demo-only password for every demo email login, published in DEMO.md. Never use it elsewhere.
      - key: DEMO_PASSWORD
        value: HealthOS-Demo-2026
      # WhatsApp is not set up on the demo.
      - key: WHATSAPP_PROVIDER
        value: ''
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true

  # ---------------------------------------------------------------- Web (React static site)
  - type: web
    name: healthos-demo-web
    runtime: static
    buildCommand: npm ci && npm run build --workspace apps/web
    branch: demo
    staticPublishPath: apps/web/dist
    autoDeployTrigger: checksPass # deploy only after GitHub CI passes
    buildFilter:
      paths:
        - apps/web/**
        - package.json
        - package-lock.json
        - render.yaml
    routes:
      # Proxy the API through the web origin so the HttpOnly refresh cookie is first-party
      # (onrender.com is a public suffix, so two onrender.com services are different sites).
      # If Render assigns the API a different URL, update this destination to match.
      - type: rewrite
        source: /api/*
        destination: https://healthos-demo-api.onrender.com/api/*
      # Single-page app: every other path serves index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        # Geolocation is allowed for this site only: employees need it to mark attendance.
        value: camera=(), microphone=(), geolocation=(self)
      # Only this site's own scripts and the same-origin API; QR images are data: URLs.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Public, baked into the bundle at build time. Same-origin path via the /api rewrite above.
      - key: VITE_API_BASE_URL
        value: /api/v1
      # Public URL of the patient website, used for the clinic QR code and tracking links.
      - key: VITE_PATIENT_SITE_URL
        sync: false

  # ---------------------------------------------------------------- Patient website (static site)
  # Same codebase built with VITE_APP_SURFACE=patient. Separate address, separate deploy and CDN
  # traffic; it contains no staff code.
  - type: web
    name: healthos-demo-patient
    runtime: static
    buildCommand: npm ci && npm run build:patient --workspace apps/web
    branch: demo
    staticPublishPath: apps/web/dist-patient
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/web/**
        - package.json
        - package-lock.json
        - render.yaml
    routes:
      # Same-origin API so the patient's HttpOnly sign-in cookie is first-party.
      - type: rewrite
        source: /api/*
        destination: https://healthos-demo-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      # Only this site's own scripts and the same-origin API; QR images are data: URLs.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_API_BASE_URL
        value: /api/v1
      - key: VITE_APP_SURFACE
        value: patient

  # ---------------------------------------------------------------- Redis-compatible cache / queue
  - type: keyvalue
    name: healthos-demo-redis
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction # required later for BullMQ job queues
    ipAllowList: [] # private network only; not reachable from the internet
