# Render Blueprint: https://render.com/docs/blueprint-spec
# Creates the API, the staff/employee web app, the patient website and a private Redis-compatible Key Value instance.
# PostgreSQL is hosted on Neon (not Render). Paste Neon's connection strings when Render prompts for
# the `sync: false` variables. Never commit real values to this file.

services:
  # ---------------------------------------------------------------- API (Express)
  - type: web
    name: healthos-api
    runtime: node
    region: singapore # keep close to the Neon region (AWS ap-southeast-1, Singapore)
    plan: free # free instances sleep after inactivity and cannot run preDeployCommand
    # Migrations run during the build because free instances do not support preDeployCommand.
    buildCommand: npm ci && npm run db:migrate
    startCommand: npm run start --workspace apps/api
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass # deploy only after GitHub CI passes
    buildFilter:
      paths:
        - apps/api/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: APP_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: '15'
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: '14'
      # Neon POOLED connection string (host contains "-pooler"), ending in ?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Neon DIRECT connection string (host without "-pooler"), used only for migrations
      - key: DATABASE_MIGRATION_URL
        sync: false
      # https:// URL of the healthos-web static site, used for CORS
      - key: FRONTEND_URL
        sync: false
      # https:// URL of the healthos-patient static site (CORS and links sent to patients)
      - key: PATIENT_SITE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: healthos-redis
          property: connectionString
      # SMS for employee OTPs (sign-in and attendance). Needs an MSG91 account with a DLT-approved
      # OTP template. Until these are set, employee sign-in and attendance show "SMS not set up".
      - key: SMS_PROVIDER
        value: msg91
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_OTP_TEMPLATE_ID
        sync: false
      # Name of the OTP variable in your MSG91 template (e.g. otp or var1).
      - key: MSG91_OTP_VARIABLE
        value: otp
      # Optional SMS appointment confirmations (separate DLT template).
      - key: MSG91_APPOINTMENT_TEMPLATE_ID
        sync: false
      # Optional "you have a new message" SMS for employees (separate DLT template).
      - key: MSG91_MESSAGE_ALERT_TEMPLATE_ID
        sync: false
      # WhatsApp Business Platform (Meta Cloud API). Leave the provider empty until Meta is set up.
      # Webhook URL to give Meta: https://<api host>/api/v1/webhooks/whatsapp
      - key: WHATSAPP_PROVIDER
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: WHATSAPP_GRAPH_API_VERSION
        sync: false
      - key: WHATSAPP_APPOINTMENT_TEMPLATE
        sync: false

  # ---------------------------------------------------------------- Web (React static site)
  - type: web
    name: healthos-web
    runtime: static
    buildCommand: npm ci && npm run build --workspace apps/web
    staticPublishPath: apps/web/dist
    autoDeployTrigger: checksPass # deploy only after GitHub CI passes
    buildFilter:
      paths:
        - apps/web/**
        - package.json
        - package-lock.json
        - render.yaml
    routes:
      # Proxy the API through the web origin so the HttpOnly refresh cookie is first-party
      # (onrender.com is a public suffix, so two onrender.com services are different sites).
      # If Render assigns the API a different URL, update this destination to match.
      - type: rewrite
        source: /api/*
        destination: https://healthos-api-gjr1.onrender.com/api/*
      # Single-page app: every other path serves index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        # Geolocation is allowed for this site only: employees need it to mark attendance.
        value: camera=(), microphone=(), geolocation=(self)
      # Only this site's own scripts and the same-origin API; QR images are data: URLs.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Public, baked into the bundle at build time. Same-origin path via the /api rewrite above.
      - key: VITE_API_BASE_URL
        value: /api/v1
      # Public URL of the patient website, used for the clinic QR code and tracking links.
      - key: VITE_PATIENT_SITE_URL
        sync: false

  # ---------------------------------------------------------------- Patient website (static site)
  # Same codebase built with VITE_APP_SURFACE=patient. Separate address, separate deploy and CDN
  # traffic; it contains no staff code.
  - type: web
    name: healthos-patient
    runtime: static
    buildCommand: npm ci && npm run build:patient --workspace apps/web
    staticPublishPath: apps/web/dist-patient
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/web/**
        - package.json
        - package-lock.json
        - render.yaml
    routes:
      # Same-origin API so the patient's HttpOnly sign-in cookie is first-party.
      - type: rewrite
        source: /api/*
        destination: https://healthos-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      # Only this site's own scripts and the same-origin API; QR images are data: URLs.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_API_BASE_URL
        value: /api/v1
      - key: VITE_APP_SURFACE
        value: patient

  # ---------------------------------------------------------------- Redis-compatible cache / queue
  - type: keyvalue
    name: healthos-redis
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction # required later for BullMQ job queues
    ipAllowList: [] # private network only; not reachable from the internet
